<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grand Prix Radio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="normalView">
    <h1>Grand Prix Radio</h1>
    <div id="nowPlaying">Loading…</div>

    <button id="playBtn" class="big" tabindex="0">Play</button>

    <div id="volumeRow">
      <span>Volume</span>
      <button id="volDown" tabindex="0">-</button>
      <span id="volLabel">70%</span>
      <button id="volUp" tabindex="0">+</button>
    </div>

    <button id="dimBtn" class="wide" tabindex="0">Audio-only (dim screen)</button>

    <p class="note">
      Playback stops if you switch to another app or Home — that's a
      webOS platform limit, not something this app can override. Dim mode
      just keeps this app's own screen quiet while it stays open.
    </p>
  </div>

  <div id="dimView" style="display:none;">
    <div id="dimNowPlaying">&nbsp;</div>
    <div class="dimHint">Press OK/Enter to return</div>
  </div>
</div>
<audio id="player" preload="none"></audio>
<script src="js/app.js"></script>
</body>
</html>
